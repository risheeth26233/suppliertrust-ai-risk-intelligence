services:
  - type: web
    name: suppliertrust-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: SUPPLIERTRUST_MODE
        value: demo
      - key: DATABASE_URL
        sync: false
      - key: SUPPLIERTRUST_ALLOWED_ORIGINS
        sync: false
